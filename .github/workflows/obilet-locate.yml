name: obilet-locate

# Finds obilet hotel-search location ids (prints ::notice:: lines). Manual runs only; the
# public repository keeps no artifacts of it.
on:
  workflow_dispatch:
    inputs:
      queries:
        description: "Search texts, separated by |"
        required: false
        default: "Fethiye|Ölüdeniz|Trabzon|Maçka|Göreme|Ürgüp|Uçhisar|Gaziantep|Palandöken|Erzurum"

jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hotels
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Locate
        env:
          QUERIES: ${{ github.event.inputs.queries || 'Fethiye|Ölüdeniz|Trabzon|Maçka|Göreme|Ürgüp|Uçhisar|Gaziantep|Palandöken|Erzurum' }}
        run: |
          IFS='|' read -ra Q <<< "$QUERIES"
          python obilet_locate.py "${Q[@]}"

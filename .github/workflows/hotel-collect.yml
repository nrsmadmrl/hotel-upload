name: hotel-collect

# obilet hotel prices for the eight pilot regions (hotels/obilet.py), written to a separate
# private data repository. This code repository is public, so standard runners are free;
# nothing collected is uploaded as an Actions artifact here.
#
# Pace follows the flight collector (mertkiyar/rotelio-collector): at least 30 s between
# searches, one region at a time, a refusal stops that region, two refusals stop the run,
# no automatic retries. Two batches of four regions run one after the other (~2.5 h each).
#
# Required settings (repository Settings > Secrets and variables > Actions):
#   HOTEL_DATA_REPOSITORY  variable  private data repository, owner/name
#   HOTEL_DATA_TOKEN       secret    fine-grained token: that repository only, Contents read/write
#   COLLECTION_ENABLED     variable  "true" lets the schedule run (manual runs always work)
on:
  schedule:
    # 21:17 UTC Monday and Thursday = 00:17 Tuesday and Friday in Turkey. Both batches end
    # before the flight collector's first daily slot (09:17 Turkey time).
    - cron: "17 21 * * 1,4"
  workflow_dispatch:
    inputs:
      region:
        description: "region_id(s), comma-separated, or all"
        default: "all"
      limit:
        description: "only the first N queries per region (0 = full plan)"
        default: "0"

permissions:
  contents: read

concurrency:
  group: hotel-collect
  cancel-in-progress: false

jobs:
  batches:
    if: ${{ github.event.repository.private == false && (github.event_name == 'workflow_dispatch' || vars.COLLECTION_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.pick.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        env:
          WANT: ${{ github.event.inputs.region || 'all' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          cfg = json.load(open("hotels/obilet_regions.json", encoding="utf-8"))
          ready = [r["region_id"] for r in cfg["regions"] if (r.get("location") or {}).get("externalId")]
          want = os.environ["WANT"].replace(" ", "")
          if want == "all":
              batches = [",".join(ready[i:i + 4]) for i in range(0, len(ready), 4)]
          else:
              batches = [",".join(r for r in want.split(",") if r in ready)]
          print("list=" + json.dumps([b for b in batches if b]))
          PY

  collect:
    needs: batches
    if: needs.batches.outputs.list != '[]'
    name: Collect ${{ matrix.regions }}
    runs-on: ubuntu-latest
    timeout-minutes: 210
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        regions: ${{ fromJson(needs.batches.outputs.list) }}
    env:
      HOTEL_DATA_REPOSITORY: ${{ vars.HOTEL_DATA_REPOSITORY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check access to the private data repository
        env:
          HOTEL_DATA_TOKEN: ${{ secrets.HOTEL_DATA_TOKEN }}
        run: |
          test -n "$HOTEL_DATA_REPOSITORY" || { echo "::error::Set the HOTEL_DATA_REPOSITORY variable"; exit 1; }
          test -n "$HOTEL_DATA_TOKEN" || { echo "::error::Set the HOTEL_DATA_TOKEN secret"; exit 1; }
          vis=$(curl -fsS -H "Authorization: Bearer $HOTEL_DATA_TOKEN" "https://api.github.com/repos/$HOTEL_DATA_REPOSITORY" | python3 -c "import json,sys; print(json.load(sys.stdin)['private'])")
          test "$vis" = "True" || { echo "::error::$HOTEL_DATA_REPOSITORY must be a private repository"; exit 1; }
          echo "private data repository reachable"
      - name: Install
        working-directory: hotels
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Offline tests
        working-directory: hotels
        run: python -m unittest discover -s tests
      - name: Collect
        id: collect
        working-directory: hotels
        run: |
          set +e
          python obilet.py collect --region "${{ matrix.regions }}" --limit "${{ github.event.inputs.limit || '0' }}" --out "$RUNNER_TEMP/out"
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" = 1 ] && echo "::warning::one region was refused by obilet; the others were collected"
          [ "$code" = 2 ] && echo "::warning::some regions ended with errors; see the log"
          exit 0
      - name: Commit to the private data repository
        env:
          HOTEL_DATA_TOKEN: ${{ secrets.HOTEL_DATA_TOKEN }}
        run: |
          ls "$RUNNER_TEMP/out"/* >/dev/null 2>&1 || { echo "nothing collected"; exit 0; }
          git clone -q --depth 1 "https://x-access-token:${HOTEL_DATA_TOKEN}@github.com/${HOTEL_DATA_REPOSITORY}.git" "$RUNNER_TEMP/data"
          cd "$RUNNER_TEMP/data"
          # an empty data repository (no README yet) has no branch: start main
          git rev-parse -q --verify HEAD >/dev/null || git checkout -q -b main
          branch=$(git symbolic-ref --short HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "41898978+github-actions[bot]@users.noreply.github.com"
          mkdir -p obilet && cp -r "$RUNNER_TEMP/out"/* obilet/
          python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path("obilet")
          latest = {}
          for m in sorted(root.glob("*/*/manifest.json")):
              info = json.loads(m.read_text(encoding="utf-8"))
              latest[info["region_id"]] = dict(collection_date=info["collection_date"], path=str(m.parent),
                                               query_states=info["query_states"], hotels_seen=info["hotels_seen"],
                                               stopped_early=info["stopped_early"])
          (root / "latest.json").write_text(json.dumps(latest, ensure_ascii=False, indent=2), encoding="utf-8")
          PY
          git add -A
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -q -m "obilet hotels $(TZ=Europe/Istanbul date +%F): ${{ matrix.regions }} (run ${{ github.run_id }})"
          git push -q origin "HEAD:$branch" || { git pull -q --rebase origin "$branch" && git push -q origin "HEAD:$branch"; }
          git log --oneline -1
      - name: Stop the remaining batches after two refusals
        if: steps.collect.outputs.code == '3'
        run: |
          echo "::error::two regions were refused by obilet; the next batch is not started"
          exit 1
